{% extends 'base.html' %}
{% block content %}

<h3>Owners List</h3>

<table>
    <tr>
        <th>Username</th>
        <th>Email</th>
        <th>Status</th>
        <th>Action</th>
    </tr>

    {% for owner in owners %}
    <tr>
        <td>{{ owner.username }}</td>
        <td>{{ owner.email }}</td>
        <td>
            {% if owner.is_active %}
            <span style="color:green;">Active</span>
            {% else %}
            <span style="color:red;">Inactive</span>
            {% endif %}
        </td>
        <td>

            <form method="post" action="{% url 'toggle_owner_status' owner.id %}" style="display:inline;">
                {% csrf_token %}
                <button type="submit">
                    {% if owner.is_active %}
                    Deactivate
                    {% else %}
                    Activate
                    {% endif %}
                </button>
            </form>

        </td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="4">No owners found.</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
