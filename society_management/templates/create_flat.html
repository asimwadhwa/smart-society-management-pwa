{% extends 'base.html' %}
{% block content %}

<h3>Create Flat</h3>

<form method="post">
    {% csrf_token %}

    <label>Society</label>
    <select name="society" required>
        <option value="">-- Select --</option>
        {% for s in societies %}
            <option value="{{ s.id }}">{{ s.name }}</option>
        {% endfor %}
    </select>

    <label>Flat Number</label>
    <input type="text" name="flat_number" maxlength="10" required>

    <label>Assign Owner</label>
    <select name="owner">
        <option value="">-- Select --</option>
        {% for o in owners %}
            <option value="{{ o.id }}">{{ o.username }}</option>
        {% endfor %}
    </select>

    <label>Assign Tenant</label>
    <select name="tenant">
        <option value="">-- Select --</option>
        {% for tenant in tenants %}
            <option value="{{ tenant.id }}">{{ tenant.username }}</option>
        {% endfor %}
    </select>

    <button type="submit">Save Flat</button>
</form>

{% endblock %}
